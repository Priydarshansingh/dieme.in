<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="leviAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leviHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="bladeShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#leviAura)"/>

  <!-- Scout Green Cloak Background Glow -->
  <circle cx="35" cy="55" r="14" fill="#15803D" opacity="0.3" filter="url(#bladeShine)"/>
  <circle cx="165" cy="145" r="16" fill="#38BDF8" opacity="0.25" filter="url(#bladeShine)"/>

  <!-- Scout Uniform Jacket & White Cravat -->
  <path d="M 48 200 L 72 144 L 100 162 L 128 144 L 152 200 Z" fill="#78350F"/>
  <!-- Scout Green Hooded Cloak Shoulder Trim -->
  <path d="M 46 200 L 64 150 L 80 180 Z" fill="#14532D"/>
  <path d="M 154 200 L 136 150 L 120 180 Z" fill="#14532D"/>
  <!-- Pure White Signature Ascot / Cravat -->
  <polygon points="90,140 110,140 116,166 100,172 84,166" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <polygon points="94,142 106,142 110,158 100,164 90,158" fill="#E2E8F0"/>

  <!-- Pale Lean Neck -->
  <path d="M 88 126 L 112 126 L 110 144 L 90 144 Z" fill="#F3E5D8"/>

  <!-- Razor Sharp Jawline Face -->
  <path d="M 74 88 Q 72 124 100 140 Q 128 124 126 88 Z" fill="#FDF2E9"/>

  <!-- Deadpan Cold Steely Gray Eyes -->
  <polygon points="76,96 92,97 88,101 78,100" fill="#FFFFFF"/>
  <polygon points="80,97 88,97 86,100 81,100" fill="#64748B"/>
  <circle cx="84" cy="98.5" r="1" fill="#0F172A"/>

  <polygon points="124,96 108,97 112,101 122,100" fill="#FFFFFF"/>
  <polygon points="120,97 112,97 114,100 119,100" fill="#64748B"/>
  <circle cx="116" cy="98.5" r="1" fill="#0F172A"/>

  <!-- Tired / Stern Brow -->
  <line x1="74" y1="92" x2="93" y2="93" stroke="#1E293B" stroke-width="2"/>
  <line x1="126" y1="92" x2="107" y2="93" stroke="#1E293B" stroke-width="2"/>
  <line x1="77" y1="103" x2="89" y2="103" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="123" y1="103" x2="111" y2="103" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Narrow Slit Mouth (No emotion) -->
  <line x1="94" y1="122" x2="106" y2="122" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Undercut Sleek Raven Hair with Center Parting -->
  <path d="M 70 88 Q 66 54 86 46 Q 96 38 100 42 Q 104 38 114 46 Q 134 54 130 88 Q 124 64 116 68 Q 100 74 84 68 Q 76 64 70 88 Z" fill="url(#leviHair)"/>
  <!-- Middle Parting Curtain Bangs -->
  <path d="M 84 66 Q 94 72 96 86 Q 92 84 88 74 Z" fill="#0F172A"/>
  <path d="M 116 66 Q 106 72 104 86 Q 108 84 112 74 Z" fill="#0F172A"/>
</svg>

