<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="nikaSunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cloudHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="joyBoyEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <filter id="smokeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sun God Background -->
  <rect width="200" height="200" rx="100" fill="url(#nikaSunAura)"/>

  <!-- Celestial Hagoromo Floating Clouds (White Steam Ribbons) -->
  <path d="M 24 130 C 10 90, 40 40, 70 30 C 55 45, 45 75, 50 110 Z" fill="#FFFFFF" opacity="0.6" filter="url(#smokeGlow)"/>
  <path d="M 176 130 C 190 90, 160 40, 130 30 C 145 45, 155 75, 150 110 Z" fill="#FFFFFF" opacity="0.6" filter="url(#smokeGlow)"/>

  <!-- White Shirt / Open Red Vest with Yellow Sash -->
  <path d="M 52 200 L 74 154 L 100 166 L 126 154 L 148 200 Z" fill="#DC2626"/>
  <path d="M 78 158 L 100 186 L 122 158 L 114 152 L 100 168 L 86 152 Z" fill="#FEF08A"/>

  <!-- Slender Cheerful Neck -->
  <path d="M 88 134 L 112 134 L 116 158 L 84 158 Z" fill="#F8D7C4"/>

  <!-- Luffy Face -->
  <path d="M 72 90 Q 70 128 100 144 Q 130 128 128 90 Z" fill="#FCE8DE"/>

  <!-- Iconic Left Eye Scar with 2 Stitches -->
  <path d="M 80 114 Q 85 116 88 115" stroke="#991B1B" stroke-width="1.5" fill="none"/>
  <line x1="82" y1="112" x2="82" y2="117" stroke="#991B1B" stroke-width="1.2"/>
  <line x1="86" y1="113" x2="86" y2="118" stroke="#991B1B" stroke-width="1.2"/>

  <!-- Whimsical JoyBoy Eyes (Spiral/Ruby Glowing) -->
  <ellipse cx="85" cy="100" rx="7.5" ry="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="85" cy="100" r="4.5" fill="url(#joyBoyEye)"/>
  <circle cx="86" cy="99" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="115" cy="100" rx="7.5" ry="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="115" cy="100" r="4.5" fill="url(#joyBoyEye)"/>
  <circle cx="116" cy="99" r="1.5" fill="#FFFFFF"/>

  <!-- Joyful Giant Open-Mouth D-Smile -->
  <path d="M 78 116 Q 100 144 122 116 Q 100 120 78 116 Z" fill="#7F1D1D" stroke="#000000" stroke-width="1.5"/>
  <!-- White Teeth Row -->
  <path d="M 80 118 Q 100 126 120 118 Q 100 122 80 118 Z" fill="#FFFFFF"/>
  <!-- Pink Tongue -->
  <path d="M 88 130 Q 100 134 112 130 Q 100 142 88 130 Z" fill="#F43F5E"/>

  <!-- Gear 5 Fluffy Cloud Hair (Flaming/Swirling White Steam) -->
  <!-- Floating voluminous cloud tufts -->
  <path d="M 68 88 C 45 84, 40 60, 56 46 C 45 32, 65 14, 84 22 C 92 10, 110 8, 118 20 C 136 12, 158 28, 146 48 C 162 60, 156 84, 134 88 Z" fill="url(#cloudHair)"/>
  <!-- Fluffy Cloud Swirls Details -->
  <path d="M 64 52 Q 74 38 88 46" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 112 44 Q 126 38 136 54" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 90 28 Q 100 20 110 28" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Straw Hat dangling on the back with yellow rim & red ribbon -->
  <path d="M 40 145 C 50 175, 150 175, 160 145 C 150 140, 50 140, 40 145 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5" opacity="0.85"/>
  <path d="M 52 148 C 65 162, 135 162, 148 148" stroke="#DC2626" stroke-width="4" fill="none"/>

  <!-- Specular Golden Ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
</svg>
