<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#450A0A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#180404" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="tanjiroHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="60%" stop-color="#450A0A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="solarFlame" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#sunAura)"/>

  <!-- Sun Breathing Solar Flames -->
  <circle cx="30" cy="70" r="14" fill="#F97316" opacity="0.4" filter="url(#solarFlame)"/>
  <circle cx="170" cy="60" r="12" fill="#EF4444" opacity="0.4" filter="url(#solarFlame)"/>
  <circle cx="165" cy="140" r="16" fill="#FBBF24" opacity="0.3" filter="url(#solarFlame)"/>

  <!-- Green & Black Checkered Haori Collar -->
  <path d="M 48 200 L 72 144 L 100 162 L 128 144 L 152 200 Z" fill="#047857"/>
  <!-- Checkers -->
  <rect x="52" y="165" width="16" height="16" fill="#111827"/>
  <rect x="68" y="181" width="16" height="16" fill="#111827"/>
  <rect x="132" y="165" width="16" height="16" fill="#111827"/>
  <rect x="116" y="181" width="16" height="16" fill="#111827"/>
  <rect x="84" y="180" width="16" height="16" fill="#047857"/>
  <rect x="100" y="180" width="16" height="16" fill="#111827"/>
  <path d="M 68 146 L 100 168 L 132 146 L 126 138 L 100 152 L 74 138 Z" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>

  <!-- Warm Neck -->
  <path d="M 86 126 L 114 126 L 112 154 L 88 154 Z" fill="#EBC8B2"/>

  <!-- Determined Face -->
  <path d="M 72 86 Q 70 126 100 142 Q 130 126 128 86 Z" fill="#FDE2D2"/>

  <!-- Flame Demon Slayer Mark on Upper Forehead -->
  <path d="M 80 64 Q 76 74 80 82 Q 84 76 86 70 Z" fill="#991B1B"/>
  <path d="M 83 68 Q 80 78 84 84 Q 88 80 88 74 Z" fill="#DC2626"/>

  <!-- Hanafuda Earrings (Right and Left) -->
  <rect x="62" y="104" width="7" height="14" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <circle cx="65.5" cy="108" r="2" fill="#DC2626"/>
  <line x1="62" y1="114" x2="69" y2="114" stroke="#000000" stroke-width="0.8"/>

  <rect x="131" y="104" width="7" height="14" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <circle cx="134.5" cy="108" r="2" fill="#DC2626"/>
  <line x1="131" y1="114" x2="138" y2="114" stroke="#000000" stroke-width="0.8"/>

  <!-- Warm Ruby Red Eyes with Kind Resolve -->
  <circle cx="84" cy="98" r="7" fill="#7F1D1D"/>
  <circle cx="84" cy="98" r="4.5" fill="#EF4444"/>
  <circle cx="82.5" cy="96" r="2" fill="#FFFFFF"/>

  <circle cx="116" cy="98" r="7" fill="#7F1D1D"/>
  <circle cx="116" cy="98" r="4.5" fill="#EF4444"/>
  <circle cx="114.5" cy="96" r="2" fill="#FFFFFF"/>

  <!-- Resolved Eyebrows -->
  <path d="M 74 90 Q 84 86 92 92" stroke="#450A0A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 126 90 Q 116 86 108 92" stroke="#450A0A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Determined Smile -->
  <path d="M 94 122 Q 100 125 106 122" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Swept-back Burgundy Spiky Hair -->
  <path d="M 68 82 Q 62 48 84 38 Q 94 28 100 32 Q 108 28 116 38 Q 138 48 132 82 Q 120 54 100 58 Q 80 54 68 82 Z" fill="url(#tanjiroHair)"/>
  <polygon points="78,54 84,34 92,52" fill="#DC2626"/>
  <polygon points="94,48 102,28 108,48" fill="#EF4444"/>
  <polygon points="108,52 116,34 122,54" fill="#DC2626"/>
</svg>

