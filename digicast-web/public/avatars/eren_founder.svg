<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="erenTitanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#052E16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02150B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="erenHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="70%" stop-color="#291104"/>
      <stop offset="100%" stop-color="#0F0501"/>
    </linearGradient>
    <filter id="titanLightning" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#erenTitanAura)"/>

  <!-- Golden Titan Lightning Arcs Background -->
  <path d="M 25 40 L 40 80 L 30 110 L 45 150" stroke="#FDE047" stroke-width="2" fill="none" opacity="0.6" filter="url(#titanLightning)"/>
  <path d="M 175 40 L 160 80 L 170 110 L 155 150" stroke="#FDE047" stroke-width="2" fill="none" opacity="0.6" filter="url(#titanLightning)"/>
  <circle cx="100" cy="30" r="14" fill="#22C55E" opacity="0.25" filter="url(#titanLightning)"/>

  <!-- Dark Maroon Shirt & Flowing Trench Coat -->
  <path d="M 46 200 L 70 144 L 100 162 L 130 144 L 154 200 Z" fill="#1C1917"/>
  <path d="M 68 146 L 100 168 L 132 146 L 126 138 L 100 152 L 74 138 Z" fill="#7F1D1D" stroke="#B91C1C" stroke-width="1.5"/>

  <!-- Lean Muscular Neck -->
  <path d="M 86 126 L 114 126 L 112 154 L 88 154 Z" fill="#E8CDBB"/>

  <!-- Haunting Intense Face -->
  <path d="M 72 86 Q 70 126 100 142 Q 130 126 128 86 Z" fill="#FCE9DE"/>

  <!-- Titan Shifter Steam Regeneration Lines under Eyes -->
  <path d="M 78 102 L 76 112" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 82 103 L 81 114" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 86 103 L 87 113" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>

  <path d="M 122 102 L 124 112" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 118 103 L 119 114" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 114 103 L 113 113" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glowing Emerald Titan Eyes (Unwavering Freedom) -->
  <polygon points="76,95 92,96 88,100 78,99" fill="#0F172A"/>
  <circle cx="84" cy="97" r="3" fill="#10B981" filter="url(#titanLightning)"/>
  <circle cx="84" cy="97" r="1.5" fill="#A7F3D0"/>

  <polygon points="124,95 108,96 112,100 122,99" fill="#0F172A"/>
  <circle cx="116" cy="97" r="3" fill="#10B981" filter="url(#titanLightning)"/>
  <circle cx="116" cy="97" r="1.5" fill="#A7F3D0"/>

  <!-- Intimidating Intense Brow -->
  <path d="M 73 91 L 93 93" stroke="#291104" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 127 91 L 107 93" stroke="#291104" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Unyielding Stern Mouth -->
  <path d="M 94 122 L 106 122" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>

  <!-- Long Flowing Shoulder-Length Brown Hair Parted in Middle (Man-Bun Shifter Style) -->
  <path d="M 66 84 Q 60 52 82 44 Q 92 36 100 40 Q 108 36 118 44 Q 140 52 134 84 Q 126 66 118 68 Q 100 74 82 68 Q 74 66 66 84 Z" fill="url(#erenHair)"/>
  <!-- Flowing side strands framing cheeks -->
  <path d="M 68 82 Q 64 110 72 136 Q 74 120 72 90 Z" fill="#291104"/>
  <path d="M 132 82 Q 136 110 128 136 Q 126 120 128 90 Z" fill="#291104"/>
</svg>

