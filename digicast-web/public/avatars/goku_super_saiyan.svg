<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="gokuKiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ssjHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="ssjEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <rect width="200" height="200" rx="100" fill="url(#gokuKiAura)"/>

  <!-- Electric Ki Lightning Sparks -->
  <path d="M 30 60 L 45 75 L 38 90 L 52 105" stroke="#FEF08A" stroke-width="2" fill="none" filter="url(#lightningGlow)" opacity="0.8"/>
  <path d="M 165 40 L 150 58 L 160 70 L 145 92" stroke="#67E8F9" stroke-width="2" fill="none" filter="url(#lightningGlow)" opacity="0.8"/>

  <!-- Orange Turtle Gi Collar & Blue Undershirt -->
  <path d="M 50 200 L 75 152 L 100 166 L 125 152 L 150 200 Z" fill="#EA580C"/>
  <path d="M 80 156 L 100 178 L 120 156 L 115 150 L 100 164 L 85 150 Z" fill="#1D4ED8"/>

  <!-- Muscular Neck -->
  <path d="M 84 130 L 116 130 L 120 156 L 80 156 Z" fill="#F8D7C4"/>
  <path d="M 92 136 L 90 154" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <path d="M 108 136 L 110 154" stroke="#DC2626" stroke-width="1" opacity="0.4"/>

  <!-- Face Contour -->
  <path d="M 70 88 Q 68 126 100 144 Q 132 126 130 88 Z" fill="#FDE047" opacity="0.1"/>
  <path d="M 72 88 Q 70 126 100 142 Q 130 126 128 88 Z" fill="#FCE8DE"/>

  <!-- Fierce Eyebrows (Golden SSJ) -->
  <polygon points="68,88 94,92 92,86 72,82" fill="#CA8A04"/>
  <polygon points="132,88 106,92 108,86 128,82" fill="#CA8A04"/>

  <!-- Determined Emerald Green SSJ Eyes -->
  <polygon points="74,93 92,95 88,103 76,101" fill="#FFFFFF"/>
  <polygon points="81,94 88,95 86,101 81,100" fill="url(#ssjEyes)"/>
  <circle cx="83" cy="97" r="1" fill="#000000"/>

  <polygon points="126,93 108,95 112,103 124,101" fill="#FFFFFF"/>
  <polygon points="119,94 112,95 114,101 119,100" fill="url(#ssjEyes)"/>
  <circle cx="117" cy="97" r="1" fill="#000000"/>

  <!-- Nose & Battle Grit Smile -->
  <path d="M 98 106 L 102 114 L 97 114" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 90 126 Q 100 122 110 126" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Iconic Spiky Super Saiyan Hair -->
  <!-- Huge Ascending Spikes -->
  <path d="M 68 90 L 36 68 L 56 62 L 26 38 L 54 36 L 44 14 L 74 24 L 78 4 L 98 22 L 106 6 L 120 22 L 138 8 L 134 28 L 158 18 L 148 40 L 174 42 L 150 64 L 168 74 L 134 90 Z" fill="url(#ssjHair)"/>
  <!-- Front Bangs dangling onto forehead -->
  <polygon points="80,84 86,106 94,86" fill="#FACC15"/>
  <polygon points="92,86 98,110 106,86" fill="#FEF08A"/>
  <polygon points="104,86 112,104 118,84" fill="#EAB308"/>

  <!-- Border Ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#FACC15" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
</svg>