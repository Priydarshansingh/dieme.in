<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sageAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#9A3412" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="narutoHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="url(#sageAura)"/>

  <!-- Red Sage Cloak with Black Flames -->
  <path d="M 48 200 L 72 150 L 100 164 L 128 150 L 152 200 Z" fill="#DC2626"/>
  <!-- Black Flame Pattern at Collar -->
  <path d="M 72 154 L 80 170 L 88 158 L 100 176 L 112 158 L 120 170 L 128 154 Z" fill="#09090B"/>

  <!-- Neck with Black Collar Underneath -->
  <path d="M 86 130 L 114 130 L 116 154 L 84 154 Z" fill="#F8D7C4"/>

  <!-- Face -->
  <path d="M 72 88 Q 70 126 100 144 Q 130 126 128 88 Z" fill="#FCE8DE"/>

  <!-- Whiskers on Cheeks -->
  <line x1="72" y1="112" x2="80" y2="114" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="71" y1="118" x2="81" y2="119" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="73" y1="124" x2="82" y2="124" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="128" y1="112" x2="120" y2="114" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="129" y1="118" x2="119" y2="119" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="127" y1="124" x2="118" y2="124" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sage Mode Orange Pigment around Eyes -->
  <ellipse cx="84" cy="98" rx="14" ry="10" fill="#EA580C" opacity="0.85"/>
  <ellipse cx="116" cy="98" rx="14" ry="10" fill="#EA580C" opacity="0.85"/>

  <!-- Yellow Toad Sage Eyes with Horizontal Bar Pupils -->
  <polygon points="76,95 92,96 88,103 78,102" fill="#FEF08A"/>
  <ellipse cx="84" cy="99" rx="5" ry="4" fill="#FACC15"/>
  <rect x="80" y="98" width="8" height="2" fill="#451A03" rx="0.5"/>

  <polygon points="124,95 108,96 112,103 122,102" fill="#FEF08A"/>
  <ellipse cx="116" cy="99" rx="5" ry="4" fill="#FACC15"/>
  <rect x="112" y="98" width="8" height="2" fill="#451A03" rx="0.5"/>

  <!-- Leaf Headband (Black Fabric & Metal Plate) -->
  <path d="M 68 76 C 68 68 132 68 132 76 L 130 88 C 130 92 70 92 70 88 Z" fill="#18181B"/>
  <rect x="80" y="74" width="40" height="15" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- Leaf Swirl Symbol -->
  <path d="M 98 81 Q 102 78 105 81 Q 104 85 99 84" stroke="#1E293B" stroke-width="1.5" fill="none"/>
  <polygon points="98,84 94,86 97,82" fill="#1E293B"/>

  <!-- Signature Spiky Yellow Hair -->
  <path d="M 66 84 L 46 64 L 62 58 L 44 38 L 68 38 L 62 18 L 84 26 L 90 10 L 102 24 L 114 8 L 120 26 L 140 18 L 134 38 L 158 38 L 140 58 L 156 64 L 136 84 Z" fill="url(#narutoHair)"/>

  <!-- Determined Grin -->
  <path d="M 92 124 Q 100 128 108 124" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Golden Ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#F97316" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#FACC15" stroke-width="1.5" opacity="0.8"/>
</svg>