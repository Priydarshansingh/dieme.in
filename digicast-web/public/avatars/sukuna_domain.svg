<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sukunaDomain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#260404" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F0202" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sukunaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="crimsonCleave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#sukunaDomain)"/>

  <!-- Malevolent Shrine Crimson Blood Aura -->
  <circle cx="32" cy="60" r="14" fill="#DC2626" opacity="0.4" filter="url(#crimsonCleave)"/>
  <circle cx="168" cy="135" r="16" fill="#991B1B" opacity="0.4" filter="url(#crimsonCleave)"/>
  <circle cx="165" cy="45" r="8" fill="#F43F5E" opacity="0.5"/>

  <!-- White Kimono with Dark Neck Opening -->
  <path d="M 48 200 L 70 144 L 100 162 L 130 144 L 152 200 Z" fill="#F8FAFC"/>
  <path d="M 68 146 L 100 168 L 132 146 L 126 138 L 100 152 L 74 138 Z" fill="#18181B" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Neck with Black Cursed Tattoos -->
  <path d="M 86 126 L 114 126 L 112 154 L 88 154 Z" fill="#E8C8B5"/>
  <path d="M 90 134 Q 100 140 110 134" stroke="#0F172A" stroke-width="3" fill="none"/>
  <path d="M 92 142 Q 100 148 108 142" stroke="#0F172A" stroke-width="2" fill="none"/>

  <!-- Face with Demonic Markings -->
  <path d="M 72 86 Q 70 126 100 142 Q 130 126 128 86 Z" fill="#FDE2D2"/>

  <!-- Sukuna's Forehead Cursed Mark -->
  <circle cx="100" cy="62" r="3" fill="#0F172A"/>
  <path d="M 95 64 Q 100 70 105 64" stroke="#0F172A" stroke-width="2.5" fill="none"/>

  <!-- Cheek Cursed Tattoos (Two stripes on each cheek) -->
  <path d="M 74 108 L 84 114" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 76 114 L 86 120" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <path d="M 126 108 L 116 114" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 124 114 L 114 120" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- 4 Demonic Eyes (2 Main Glowing Crimson + 2 Slits Underneath) -->
  <!-- Main Left Eye -->
  <polygon points="76,94 92,95 88,100 78,99" fill="#0F172A"/>
  <circle cx="84" cy="97" r="3" fill="#DC2626" filter="url(#crimsonCleave)"/>
  <circle cx="84" cy="97" r="1.5" fill="#FEE2E2"/>
  <!-- Under Left Eye Slit -->
  <path d="M 78 103 Q 84 105 88 103" stroke="#DC2626" stroke-width="2" fill="none"/>

  <!-- Main Right Eye -->
  <polygon points="124,94 108,95 112,100 122,99" fill="#0F172A"/>
  <circle cx="116" cy="97" r="3" fill="#DC2626" filter="url(#crimsonCleave)"/>
  <circle cx="116" cy="97" r="1.5" fill="#FEE2E2"/>
  <!-- Under Right Eye Slit -->
  <path d="M 122 103 Q 116 105 112 103" stroke="#DC2626" stroke-width="2" fill="none"/>

  <!-- Menacing Brow -->
  <path d="M 74 90 L 93 93" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <path d="M 126 90 L 107 93" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

  <!-- Sinister Sharp Smirk Showing Fangs -->
  <path d="M 92 120 Q 100 128 112 119" stroke="#0F172A" stroke-width="2.5" fill="none"/>
  <polygon points="98,121 101,125 104,121" fill="#FFFFFF"/>
  <polygon points="104,121 107,125 110,121" fill="#FFFFFF"/>

  <!-- Spiky Slicked-back Pink/Magenta Hair -->
  <path d="M 68 82 Q 60 48 82 36 Q 92 24 100 30 Q 108 24 118 36 Q 140 48 132 82 Q 120 54 100 56 Q 80 54 68 82 Z" fill="url(#sukunaHair)"/>
  <polygon points="76,52 82,30 90,50" fill="#F472B6"/>
  <polygon points="92,44 100,24 108,44" fill="#F472B6"/>
  <polygon points="110,50 118,30 124,52" fill="#F472B6"/>
</svg>
