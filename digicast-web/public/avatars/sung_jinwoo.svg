<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="shadowMonarchAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0764" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="jinwooHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="purpleGlare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Shadow Realm Background -->
  <rect width="200" height="200" rx="100" fill="url(#shadowMonarchAura)"/>

  <!-- Shadow Extraction Smoke Tendrils -->
  <path d="M 35 180 Q 20 120 40 80 Q 48 100 45 140 Z" fill="#7E22CE" opacity="0.4" filter="url(#purpleGlare)"/>
  <path d="M 165 180 Q 180 120 160 80 Q 152 100 155 140 Z" fill="#7E22CE" opacity="0.4" filter="url(#purpleGlare)"/>

  <!-- Sleek Midnight High Trench Coat -->
  <path d="M 48 200 L 72 146 L 100 160 L 128 146 L 152 200 Z" fill="#090D16"/>
  <path d="M 68 148 L 100 166 L 132 148 L 124 138 L 100 150 L 76 138 Z" fill="#18181B" stroke="#8B5CF6" stroke-width="1.5"/>

  <!-- Pale Athletic Neck -->
  <path d="M 86 128 L 114 128 L 112 152 L 88 152 Z" fill="#E8D5C8"/>

  <!-- Sharp V-Jaw Face -->
  <path d="M 72 88 Q 70 126 100 144 Q 130 126 128 88 Z" fill="#FCECE5"/>

  <!-- Shadow Eyes — Intense Electric Blue/Purple Glare (ARISE) -->
  <polygon points="76,96 94,97 90,102 78,101" fill="#FFFFFF"/>
  <polygon points="80,97 90,97 87,101 81,100" fill="#38BDF8" filter="url(#purpleGlare)"/>
  <circle cx="85" cy="99" r="1.5" fill="#FFFFFF"/>
  <!-- Left Eye Light Flare Trail -->
  <path d="M 76 98 Q 62 90 54 84" stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#purpleGlare)"/>

  <polygon points="124,96 106,97 110,102 122,101" fill="#FFFFFF"/>
  <polygon points="120,97 110,97 113,101 119,100" fill="#38BDF8" filter="url(#purpleGlare)"/>
  <circle cx="115" cy="99" r="1.5" fill="#FFFFFF"/>
  <!-- Right Eye Light Flare Trail -->
  <path d="M 124 98 Q 138 90 146 84" stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#purpleGlare)"/>

  <!-- Calm Cold Smirk -->
  <path d="M 96 122 Q 100 124 106 121" stroke="#4C1D95" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Sleek Shadow Hunter Bangs & Modern Spikes -->
  <path d="M 68 88 L 52 70 L 62 62 L 50 42 L 72 40 L 76 22 L 96 34 L 102 18 L 116 32 L 132 20 L 130 40 L 150 44 L 140 64 L 152 72 L 134 88 Z" fill="url(#jinwooHair)"/>
  <!-- Center Front Hair Fringe -->
  <polygon points="78,74 86,96 92,76" fill="#1E293B"/>
  <polygon points="90,76 96,104 102,76" fill="#0F172A"/>
  <polygon points="100,76 108,98 116,74" fill="#1E293B"/>

  <!-- Specular Purple Shadow Ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.85"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.75"/>
</svg>