<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="zoroAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#022C22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#021C16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="zoroHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="enmaHaki" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#zoroAura)"/>

  <!-- Enma Purple Dragon Flame Aura Sparks -->
  <circle cx="30" cy="65" r="12" fill="#A855F7" opacity="0.4" filter="url(#enmaHaki)"/>
  <circle cx="170" cy="130" r="16" fill="#10B981" opacity="0.3" filter="url(#enmaHaki)"/>
  <circle cx="165" cy="50" r="8" fill="#34D399" opacity="0.5"/>

  <!-- Dark Green Wano Haori Robe -->
  <path d="M 46 200 L 70 144 L 100 162 L 130 144 L 154 200 Z" fill="#064E3B"/>
  <path d="M 68 146 L 100 168 L 132 146 L 126 138 L 100 152 L 74 138 Z" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>

  <!-- Broad Muscular Neck -->
  <path d="M 84 126 L 116 126 L 114 154 L 86 154 Z" fill="#E6C8B5"/>

  <!-- Chiseled Face -->
  <path d="M 70 86 Q 68 126 100 144 Q 132 126 130 86 Z" fill="#FADBC8"/>

  <!-- Left Eye Scar (Vertical) -->
  <path d="M 83 82 L 85 106" stroke="#991B1B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Closed Scarred Eye -->
  <line x1="77" y1="94" x2="91" y2="94" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Eye: Fierce Conqueror Haki Glare -->
  <polygon points="109,92 125,93 121,99 112,98" fill="#FFFFFF"/>
  <polygon points="113,93 121,93 118,98 114,97" fill="#10B981" filter="url(#enmaHaki)"/>
  <circle cx="116" cy="95.5" r="1.5" fill="#FFFFFF"/>
  <!-- Fierce Brow -->
  <path d="M 108 88 L 127 91" stroke="#064E3B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 73 88 L 92 90" stroke="#064E3B" stroke-width="3" stroke-linecap="round"/>

  <!-- 3 Gold Earrings on Left Ear -->
  <circle cx="64" cy="104" r="2" fill="#FBBF24"/>
  <circle cx="64" cy="109" r="2" fill="#FBBF24"/>
  <circle cx="64" cy="114" r="2" fill="#FBBF24"/>

  <!-- Stoic Smirk -->
  <path d="M 94 124 Q 100 126 108 123" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Spiky Green Moss Hair -->
  <path d="M 68 84 Q 60 50 82 44 Q 90 32 100 36 Q 112 30 120 44 Q 140 48 132 84 Q 120 62 100 66 Q 80 62 68 84 Z" fill="url(#zoroHair)"/>
  <!-- Hair locks -->
  <polygon points="76,66 84,42 90,64" fill="#34D399"/>
  <polygon points="90,60 98,38 106,60" fill="#6EE7B7"/>
  <polygon points="106,62 116,40 122,64" fill="#34D399"/>
</svg>
